<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الدرجات · قدرات الخويلدية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--board-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat span{display:block;color:var(--chalk-dim);font-size:.85rem}
.stat b{font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 16px}
.tabs button[aria-pressed="true"]{background:var(--saffron);color:var(--board);border-color:var(--saffron);font-weight:700}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{color:var(--chalk-dim);font-weight:500;font-size:.9rem;background:var(--board-2)}
tr:last-child td{border-bottom:0}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input,.tools select,.panel select{background:var(--board);border:1px solid var(--line);border-radius:8px;color:var(--chalk);padding:8px 10px;font:inherit}
.pct{font-weight:700}
.mini{background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:.85rem}
.mini.danger{color:var(--wrong);border-color:var(--wrong)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.msg{min-height:1.2em;font-size:.95rem}
.empty{color:var(--chalk-dim);padding:20px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>مدرسة الخويلدية الثانوية</h1><small id="sub">لوحة الدرجات</small></div>
    <div class="meta"><span class="chip" id="who"></span><a class="ghost" href="/">الاختبار</a><button class="ghost" id="logout" type="button">خروج</button></div>
  </header>
  <main id="view" style="display:flex;flex-direction:column;gap:18px"></main>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LEVELS={0:"كل المستويات",1:"سهل",2:"متوسط",3:"صعب"};
const ROLES={student:"طالب",teacher:"معلم",admin:"مدير النظام"};
const pctColor=p=>p>=90?"var(--right)":p>=60?"var(--saffron)":"var(--wrong)";
const fmt=d=>new Date(d).toLocaleString("ar-SA",{dateStyle:"medium",timeStyle:"short"});
const api=async(url,opt={})=>{const r=await fetch(url,{headers:{"Content-Type":"application/json"},...opt});
  if(r.status===401){location.href="/login.html";throw new Error("401");}
  const d=r.headers.get("content-type")?.includes("json")?await r.json():{};if(!r.ok)throw new Error(d.error||"حدث خطأ");return d;};
let ME=null, TAB="results";

function statsHTML(rows){
  const n=rows.length, avg=n?Math.round(rows.reduce((a,r)=>a+r.percent,0)/n):0, best=n?Math.max(...rows.map(r=>r.percent)):0;
  return `<div class="stats"><div class="stat"><span>عدد المحاولات</span><b>${n}</b></div>
  <div class="stat"><span>متوسط النسبة</span><b>${avg}%</b></div><div class="stat"><span>أعلى نسبة</span><b>${best}%</b></div></div>`;
}
function resultsTable(rows,withStudent){
  if(!rows.length)return `<div class="tbl"><div class="empty">لا توجد درجات بعد.</div></div>`;
  return `<div class="tbl"><table><thead><tr>${withStudent?"<th>الطالب</th><th>الصف</th>":""}<th>الدرجة</th><th>النسبة</th><th>المستوى</th><th>التاريخ</th>${ME.role!=="student"?"<th></th>":""}</tr></thead><tbody>
  ${rows.map(r=>`<tr>${withStudent?`<td>${esc(r.full_name)} <small style="color:var(--chalk-dim)" dir="ltr">@${esc(r.username)}</small></td><td>${esc(r.class_name||"—")}</td>`:""}
   <td>${r.score} / ${r.total}</td><td class="pct" style="color:${pctColor(r.percent)}">${r.percent}%</td><td>${LEVELS[r.level]||"—"}</td><td>${fmt(r.created_at)}</td>
   ${ME.role!=="student"?`<td><button class="mini danger" data-delres="${r.id}">حذف</button></td>`:""}</tr>`).join("")}
  </tbody></table></div>`;
}

async function student(){
  $("sub").textContent="درجاتي";
  const {results}=await api("/api/results/me");
  $("view").innerHTML=`<h2 style="font-family:var(--display);margin:0">سجل درجاتي</h2>${statsHTML(results)}${resultsTable(results,false)}`;
}

async function staff(){
  $("sub").textContent="لوحة المعلم";
  $("view").innerHTML=`<div class="tabs"><button data-t="results" aria-pressed="${TAB==="results"}">درجات الطلاب</button><button data-t="users" aria-pressed="${TAB==="users"}">المستخدمون</button></div><div id="pane"></div>`;
  $("view").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;staff();});
  TAB==="results"?await staffResults():await staffUsers();
}

let RQ={q:"",cls:""};
async function staffResults(){
  const {results}=await api("/api/admin/results");
  const classes=[...new Set(results.map(r=>r.class_name).filter(Boolean))].sort();
  const draw=()=>{
    const q=RQ.q.toLowerCase();
    const rows=results.filter(r=>(!RQ.cls||r.class_name===RQ.cls)&&(!q||r.full_name.toLowerCase().includes(q)||r.username.toLowerCase().includes(q)));
    $("list").innerHTML=statsHTML(rows)+resultsTable(rows,true);
    $("list").querySelectorAll("[data-delres]").forEach(b=>b.onclick=async()=>{if(!confirm("حذف هذه الدرجة؟"))return;await api("/api/admin/results/"+b.dataset.delres,{method:"DELETE"});staffResults();});
  };
  $("pane").innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
   <div class="tools"><input id="q" placeholder="ابحث باسم الطالب" value="${esc(RQ.q)}">
   <select id="cls"><option value="">كل الصفوف</option>${classes.map(c=>`<option ${c===RQ.cls?"selected":""}>${esc(c)}</option>`).join("")}</select>
   <a class="ghost" href="/api/admin/results.csv">تصدير CSV</a></div><div id="list" style="display:flex;flex-direction:column;gap:14px"></div></div>`;
  $("q").oninput=e=>{RQ.q=e.target.value;draw();};
  $("cls").onchange=e=>{RQ.cls=e.target.value;draw();};
  draw();
}

async function staffUsers(){
  const {users}=await api("/api/admin/users");
  const admin=ME.role==="admin";
  $("pane").innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
  <form class="panel" id="add"><h3>إضافة مستخدم</h3><div class="grid2">
    <div class="field"><label>الاسم الكامل</label><input name="full_name" required></div>
    <div class="field"><label>اسم المستخدم</label><input name="username" required dir="ltr"></div>
    <div class="field"><label>كلمة المرور</label><input name="password" required dir="ltr"></div>
    <div class="field"><label>الصف / الشعبة</label><input name="class_name"></div>
    <div class="field"><label>الصلاحية</label><select name="role"><option value="student">طالب</option>${admin?'<option value="teacher">معلم</option><option value="admin">مدير النظام</option>':""}</select></div>
  </div><div class="msg" id="addMsg"></div><button class="primary" type="submit">إضافة</button></form>
  <div class="tbl"><table><thead><tr><th>الاسم</th><th>المستخدم</th><th>الصف</th><th>الصلاحية</th><th>المحاولات</th><th>أفضل نسبة</th><th></th></tr></thead><tbody>
  ${users.map(u=>`<tr><td>${esc(u.full_name)}</td><td dir="ltr" style="text-align:end">${esc(u.username)}</td><td>${esc(u.class_name||"—")}</td><td>${ROLES[u.role]}</td>
    <td>${u.attempts}</td><td>${u.best==null?"—":u.best+"%"}</td>
    <td style="white-space:nowrap">${u.id!==ME.id&&(admin||u.role==="student")?`<button class="mini" data-pw="${u.id}">كلمة مرور</button> <button class="mini danger" data-del="${u.id}">حذف</button>`:""}</td></tr>`).join("")}
  </tbody></table></div></div>`;
  $("add").onsubmit=async e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));
    try{await api("/api/admin/users",{method:"POST",body:JSON.stringify(fd)});staffUsers();}
    catch(err){$("addMsg").style.color="var(--wrong)";$("addMsg").textContent=err.message;}};
  $("pane").querySelectorAll("[data-pw]").forEach(b=>b.onclick=async()=>{const p=prompt("كلمة المرور الجديدة (6 أحرف على الأقل):");if(!p)return;
    try{await api("/api/admin/users/"+b.dataset.pw,{method:"PATCH",body:JSON.stringify({password:p})});alert("تم تغيير كلمة المرور");}catch(err){alert(err.message);}});
  $("pane").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("حذف المستخدم وكل درجاته؟"))return;
    try{await api("/api/admin/users/"+b.dataset.del,{method:"DELETE"});staffUsers();}catch(err){alert(err.message);}});
}

$("logout").onclick=async()=>{await fetch("/api/logout",{method:"POST"});location.href="/login.html";};
(async()=>{
  ME=(await api("/api/me")).user;
  $("who").textContent=`${ME.full_name} · ${ROLES[ME.role]}`;
  ME.role==="student"?student():staff();
})();
</script>
</body>
</html>

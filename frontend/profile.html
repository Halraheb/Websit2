<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الملف الشخصي</title>
<script>try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/shell.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="nav" id="nav"></header>
<main class="app" id="view" aria-live="polite"></main>
<script src="/site.js"></script>
<script src="/common.js"></script>
<script src="/questions.js"></script>
<script src="/analytics.js"></script>
<script>
// Student profile: own profile for students, or any student's via ?id= for staff.
const ID=new URLSearchParams(location.search).get("id");

function heroHTML(p){
  const s=p.student, L=p.level;
  const toNext=L.to==null?100:Math.round((L.xp-L.from)/(L.to-L.from)*100);
  return `<section class="hero" aria-label="بطاقة الطالب">
    <div class="big-avatar" aria-hidden="true">${esc(initials(s.full_name))}</div>
    <div><h1><bdi>${esc(s.full_name)}</bdi></h1>
      <div class="sub">${[s.stage,s.class_name&&"الصف "+s.class_name].filter(Boolean).map(esc).join(" · ")}${s.stage||s.class_name?" · ":""}<bdi dir="ltr">@${esc(s.username)}</bdi></div>
      <div class="sub">عضو منذ ${fmtDay(s.created_at)}</div></div>
    <div class="lvl"><small>المستوى ${L.number}</small><b>${esc(L.title)}</b>
      <div class="bar" role="progressbar" aria-label="التقدم نحو المستوى التالي" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${toNext}"><i style="width:${toNext}%"></i></div>
      <span class="xpn"><bdi dir="ltr">${L.xp.toLocaleString(LOCALE)} XP</bdi></span>
      <small>${L.to==null?"أعلى مستوى":`باقٍ ${(L.to-L.xp).toLocaleString(LOCALE)} للمستوى التالي: ${esc(L.next_title)}`}</small></div>
  </section>`;
}

function statsHTML(st){
  const v=x=>x==null?"—":x+"%";
  return `<div class="stats">
    <div class="stat"><span>الاختبارات المنجزة</span><b>${st.attempts}</b></div>
    <div class="stat"><span>متوسط الدرجة</span><b>${v(st.avg)}</b></div>
    <div class="stat"><span>أفضل درجة</span><b>${v(st.best)}</b></div>
    <div class="stat"><span>آخر درجة</span><b>${v(st.last)}</b></div>
    <div class="stat"><span>إجابات صحيحة</span><b>${st.correct} <small>من ${st.answered}</small></b></div>
    <div class="stat"><span>أطول سلسلة أيام</span><b>${st.streak} <small>${st.streak===1?"يوم":"أيام"}</small></b></div></div>`;
}

function achievementsHTML(list){
  const earned=list.filter(a=>a.earned_at).sort((a,b)=>new Date(b.earned_at)-new Date(a.earned_at));
  const locked=list.filter(a=>!a.earned_at).sort((a,b)=>b.progress/b.goal-a.progress/a.goal);
  return `<section class="stack" aria-labelledby="achTitle">
    <div class="section-head"><div><h2 id="achTitle">الإنجازات</h2><p>${earned.length} من ${list.length} · الأقرب للتحقيق يظهر أولاً بعد المحقَّقة</p></div></div>
    <div class="badges">${[...earned,...locked].map(badgeHTML).join("")}</div></section>`;
}

function recentHTML(rows){
  if(!rows.length)return "";
  return `<section class="stack" aria-labelledby="recentTitle"><div class="section-head"><h2 id="recentTitle">آخر الاختبارات</h2></div>
    <div class="tbl"><table><thead><tr><th>التاريخ</th><th>الدرجة</th><th>النسبة</th><th>${esc(SITE.scopeHeader)}</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${fmtDate(r.created_at)}</td><td>${r.score} من ${r.total}</td><td class="pct">${r.percent}%</td><td>${esc(SITE.scopeLabel(r))}</td></tr>`).join("")}
  </tbody></table></div></section>`;
}

async function load(){
  const p=await api(ID?"/api/admin/profile/"+encodeURIComponent(ID):"/api/profile/me");
  document.title=`${p.student.full_name} · ${SITE.name}`;
  const fresh=!p.stats.attempts;
  $("view").innerHTML=`${ID?`<div><a class="ghost" href="/dashboard.html">${icon("back",16,"mirror")}<span>لوحة المعلم</span></a></div>`:""}
    ${heroHTML(p)}
    ${statsHTML(p.stats)}
    ${fresh?emptyHTML(ID?"لم يُنهِ هذا الطالب أي اختبار فردي بعد":"ابدأ أول اختبار",
        ID?"تظهر الدرجات ونقاط القوة والضعف هنا بعد أن يُنهي الطالب اختباراً فردياً.":"بعد أول اختبار فردي تظهر هنا درجاتك ونقاط قوتك وضعفك، وتبدأ الإنجازات.",
        ID?"":`<a class="primary" href="/">${icon("play",18)}<span>ابدأ اختباراً فردياً</span></a>`):""}
    ${achievementsHTML(p.achievements)}
    ${fresh?"":`<section class="stack" aria-labelledby="swTitle"><div class="section-head"><div><h2 id="swTitle">نقاط القوة والضعف</h2><p>${esc(SITE.areaIntro)}</p></div></div>
      ${renderAnalytics(p.analytics,{scope:"student",showKpis:false})}</section>`}
    ${recentHTML(p.recent)}`;
  bindCharts($("view"));
}

(async()=>{
  try{
    const me=await boot(ID?"dashboard":"profile");
    if(!ID&&me.role!=="student"){location.href="/dashboard.html";return;}
  }catch(e){bootError(e);return;}
  withStates($("view"),load,"جارٍ تحميل الملف الشخصي…");
})();
</script>
</body>
</html>

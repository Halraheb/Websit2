<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة المعلم</title>
<script>try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/shell.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="nav" id="nav"></header>
<main class="app" id="view">
  <div class="page-head"><div><h1>لوحة المعلم</h1><p>تابع أداء الطلاب، وأدر الحسابات والدرجات.</p></div></div>
  <div class="dash">
    <aside class="side" id="side" aria-label="أقسام لوحة المعلم"></aside>
    <section class="pane" id="pane" aria-live="polite"></section>
  </div>
</main>
<script src="/site.js"></script>
<script src="/common.js"></script>
<script src="/questions.js"></script>
<script src="/analytics.js"></script>
<script>
const TABS=[
  ["analytics","التحليلات","chart","تحليل الأداء: المدرسة، مرحلة، أو طالب"],
  ["students","سجل الطلاب","roster","درجة الطالب ومستوى تقدمه، يدخلها المعلم"],
  ["results","درجات الاختبارات","table","كل اختبار فردي أنهاه طالب"],
  ["users","المستخدمون","users","الحسابات والصلاحيات وكلمات المرور"],
  ...(SITE.legacy?[["legacy","السجل القديم","archive","نتائج ما قبل الحسابات"]]:[]),
];
let TAB=(()=>{try{const t=sessionStorage.getItem("tab");return TABS.some(x=>x[0]===t)?t:"analytics";}catch(e){return "analytics";}})();

function drawSide(){
  $("side").innerHTML=TABS.map(([k,t,ic])=>`<button type="button" data-t="${k}" ${k===TAB?'aria-current="true"':""}>${icon(ic,18)}<span>${t}</span></button>`).join("")
    +`<hr><a class="ghost side-cta" href="/">${icon("users",16)}<span>ابدأ مسابقة فرق</span></a>`;
  $("side").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;try{sessionStorage.setItem("tab",TAB)}catch(e){}show();});
}
function show(){
  drawSide();
  const [,title,,sub]=TABS.find(t=>t[0]===TAB);
  const fn={analytics:staffAnalytics,students:staffStudents,results:staffResults,users:staffUsers,legacy:staffLegacy}[TAB];
  withStates($("pane"),async()=>{await fn(title,sub);},`جارٍ تحميل ${title}…`);
}
const head=(title,sub,actions="")=>`<div class="section-head"><div><h2>${esc(title)}</h2><p>${esc(sub)}</p></div>${actions?`<div class="row">${actions}</div>`:""}</div>`;
const fail=(el,msg)=>{el.className="msg bad";el.textContent=msg;};

function statsHTML(rows){
  const n=rows.length, avg=n?Math.round(rows.reduce((a,r)=>a+r.percent,0)/n):null, best=n?Math.max(...rows.map(r=>r.percent)):null;
  return `<div class="stats"><div class="stat"><span>عدد الاختبارات</span><b>${n}</b></div>
  <div class="stat"><span>متوسط النسبة</span><b>${avg==null?"—":avg+"%"}</b></div><div class="stat"><span>أعلى نسبة</span><b>${best==null?"—":best+"%"}</b></div></div>`;
}

// ---------- analytics ----------
let AQ={stage:"all",user:""};
async function staffAnalytics(title,sub){
  const {users}=await api("/api/admin/users");
  const studs=users.filter(u=>u.role==="student"&&(AQ.stage==="all"||(u.stage||"")===AQ.stage));
  if(AQ.user&&!studs.some(u=>String(u.id)===AQ.user))AQ.user="";
  const qs=AQ.user?`user_id=${AQ.user}`:AQ.stage==="all"?"":`stage=${encodeURIComponent(AQ.stage)}`;
  const d=await api("/api/admin/analytics?"+qs);
  const scope=AQ.user?`الطالب: ${d.student?.full_name||""}`:AQ.stage==="all"?"المدرسة ككل":`المرحلة: ${AQ.stage||"غير محددة"}`;
  $("pane").innerHTML=`${head(title,scope)}
    <div class="tools" role="group" aria-label="نطاق التحليل">
      <select id="ast" aria-label="المرحلة"><option value="all">كل المراحل</option>${STAGES.map(s=>`<option ${s===AQ.stage?"selected":""}>${s}</option>`).join("")}<option value="" ${AQ.stage===""?"selected":""}>مرحلة غير محددة</option></select>
      <select id="asu" aria-label="الطالب"><option value="">كل طلاب النطاق (${studs.length})</option>${studs.map(u=>`<option value="${u.id}" ${String(u.id)===AQ.user?"selected":""}>${esc(u.full_name)}${u.class_name?" · "+esc(u.class_name):""}</option>`).join("")}</select>
      ${AQ.user?`<button class="ghost" id="aback" type="button">${icon("back",16,"mirror")}<span>رجوع للنطاق</span></button><a class="ghost" href="/profile.html?id=${AQ.user}">${icon("user",16)}<span>الملف والإنجازات</span></a>`:""}
    </div>
    ${studs.length||AQ.user?renderAnalytics(d,{scope:AQ.user?"student":"group"}):emptyHTML("لا يوجد طلاب في هذا النطاق","أضف حسابات الطلاب من «المستخدمون»، أو دعهم ينشئون حساباتهم من صفحة الدخول.")}`;
  $("ast").onchange=e=>{AQ.stage=e.target.value;AQ.user="";show();};
  $("asu").onchange=e=>{AQ.user=e.target.value;show();};
  if(AQ.user)$("aback").onclick=()=>{AQ.user="";show();};
  $("pane").querySelectorAll("[data-stu]").forEach(b=>b.onclick=()=>{AQ.user=b.dataset.stu;show();window.scrollTo(0,0);});
  bindCharts($("pane"));
}

// ---------- manual roster: staff enter each student's name, grade (out of 100) and progress (0–100%) ----------
const PROG=p=>p>=100?"مكتمل":p>=75?"متقدم":p>=50?"جيد":p>=25?"قيد التقدم":"بداية";
const progColor=p=>p>=75?"var(--ok)":p>=40?"var(--warn)":"var(--bad)";
let SQ={q:"",cls:""}, EDIT=null;
async function staffStudents(title,sub){
  const {students}=await api("/api/admin/students");
  const classes=[...new Set(students.map(s=>s.class_name).filter(Boolean))].sort();
  const e=EDIT&&students.find(s=>s.id===EDIT)||null;
  $("pane").innerHTML=`${head(title,sub)}
  <form class="panel" id="sf" novalidate><h3>${e?"تعديل بيانات الطالب":"إضافة طالب"}</h3><div class="grid2">
    <div class="field"><label for="sf-name">اسم الطالب</label><input id="sf-name" name="full_name" required maxlength="80" value="${esc(e?.full_name)}"></div>
    <div class="field"><label for="sf-cls">الصف أو الشعبة</label><input id="sf-cls" name="class_name" maxlength="40" list="clsList" value="${esc(e?.class_name)}"><datalist id="clsList">${classes.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div>
    <div class="field"><label for="sf-grade">الدرجة من 100 <span class="dim">(اختياري)</span></label><input id="sf-grade" name="grade" type="number" inputmode="decimal" min="0" max="100" step="0.5" dir="ltr" value="${e?.grade??""}"></div>
    <div class="field"><label for="sf-prog">مستوى التقدم: <b id="pv"></b></label><input id="sf-prog" name="progress" type="range" min="0" max="100" step="5" value="${e?.progress??0}"></div>
    <div class="field" style="grid-column:1/-1"><label for="sf-notes">ملاحظات <span class="dim">(اختياري)</span></label><input id="sf-notes" name="notes" maxlength="300" value="${esc(e?.notes)}"></div>
  </div><div class="msg" id="sMsg" role="alert"></div>
  <div class="row"><button class="primary" type="submit" id="sfBtn">${e?"حفظ التعديل":"إضافة الطالب"}</button>${e?'<button class="btn" type="button" id="cancel">إلغاء</button>':""}</div></form>
  ${students.length?`<div class="tools"><input id="sq" type="search" placeholder="ابحث باسم الطالب" aria-label="ابحث باسم الطالب" value="${esc(SQ.q)}" dir="auto">
   <select id="scls" aria-label="الصف"><option value="">كل الصفوف</option>${classes.map(c=>`<option ${c===SQ.cls?"selected":""}>${esc(c)}</option>`).join("")}</select></div>`:""}
  <div id="slist" class="stack"></div>`;
  const f=$("sf"), pv=()=>$("pv").textContent=`${f.progress.value}% · ${PROG(+f.progress.value)}`;
  f.progress.oninput=pv; pv();
  if(e){f.scrollIntoView({block:"start"});$("cancel").onclick=()=>{EDIT=null;show();};}
  f.onsubmit=async ev=>{ev.preventDefault();
    if(!f.full_name.value.trim()){fail($("sMsg"),"اكتب اسم الطالب.");f.full_name.focus();return;}
    const fd=Object.fromEntries(new FormData(f));
    await pending($("sfBtn"),"جارٍ الحفظ…",async()=>{
      try{await api("/api/admin/students"+(e?"/"+e.id:""),{method:e?"PUT":"POST",body:JSON.stringify(fd)});EDIT=null;show();}
      catch(err){fail($("sMsg"),err.message);}
    });};
  const draw=()=>{
    const q=SQ.q.toLowerCase();
    const rows=students.filter(s=>(!SQ.cls||s.class_name===SQ.cls)&&(!q||s.full_name.toLowerCase().includes(q)));
    const graded=rows.filter(s=>s.grade!=null), avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
    if(!students.length){$("slist").innerHTML=emptyHTML("لا يوجد طلاب في السجل بعد","أضف أول طالب من النموذج أعلاه: اسمه، ودرجته، ومستوى تقدمه.");return;}
    if(!rows.length){$("slist").innerHTML=emptyHTML(`لا نتائج لـ«${SQ.q||SQ.cls}»`,"جرّب اسماً آخر، أو اختر «كل الصفوف».");return;}
    $("slist").innerHTML=`<div class="stats"><div class="stat"><span>عدد الطلاب</span><b>${rows.length}</b></div>
      <div class="stat"><span>متوسط الدرجات</span><b>${graded.length?avg(graded.map(s=>s.grade)):"—"}</b></div>
      <div class="stat"><span>متوسط التقدم</span><b>${avg(rows.map(s=>s.progress))}%</b></div></div>
      <div class="tbl"><table><thead><tr><th>الطالب</th><th>الصف</th><th>الدرجة</th><th>مستوى التقدم</th><th>ملاحظات</th><th><span class="sr">إجراءات</span></th></tr></thead><tbody>
      ${rows.map(s=>`<tr><td><bdi>${esc(s.full_name)}</bdi></td><td>${esc(s.class_name||"—")}</td>
        <td class="pct">${s.grade==null?"—":s.grade}</td>
        <td><div class="prog"><div class="bar"><i style="width:${s.progress}%;background:${progColor(s.progress)}"></i></div><small>${s.progress}% · ${PROG(s.progress)}</small></div></td>
        <td class="dim">${esc(s.notes||"")}</td>
        <td style="white-space:nowrap"><button class="mini" data-ed="${s.id}">تعديل</button> <button class="mini danger" data-dels="${s.id}">حذف</button></td></tr>`).join("")}
      </tbody></table></div>`;
    $("slist").querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{EDIT=+b.dataset.ed;show();});
    $("slist").querySelectorAll("[data-dels]").forEach(b=>b.onclick=async()=>{if(!confirm("حذف هذا الطالب من السجل؟ لا يمكن التراجع."))return;
      await pending(b,"",async()=>{try{await api("/api/admin/students/"+b.dataset.dels,{method:"DELETE"});if(EDIT===+b.dataset.dels)EDIT=null;show();}catch(err){toast(`<span class="toast-ic">${icon("alert",20)}</span><div><b>تعذّر الحذف</b><small>${esc(err.message)}</small></div>`);}});});
  };
  if($("sq")){$("sq").oninput=ev=>{SQ.q=ev.target.value;draw();};$("scls").onchange=ev=>{SQ.cls=ev.target.value;draw();};}
  draw();
}

// ---------- quiz results ----------
let RQ={q:"",cls:""};
async function staffResults(title,sub){
  const {results}=await api("/api/admin/results");
  const classes=[...new Set(results.map(r=>r.class_name).filter(Boolean))].sort();
  $("pane").innerHTML=`${head(title,sub,results.length?`<a class="btn" href="/api/admin/results.csv" download>${icon("download",18)}<span>تنزيل CSV</span></a>`:"")}
   ${results.length?`<div class="tools"><input id="q" type="search" placeholder="ابحث باسم الطالب" aria-label="ابحث باسم الطالب" value="${esc(RQ.q)}" dir="auto">
   <select id="cls" aria-label="الصف"><option value="">كل الصفوف</option>${classes.map(c=>`<option ${c===RQ.cls?"selected":""}>${esc(c)}</option>`).join("")}</select></div>`:""}
   <div id="list" class="stack"></div>`;
  const draw=()=>{
    if(!results.length){$("list").innerHTML=emptyHTML("لا توجد درجات بعد","تظهر هنا نتيجة كل اختبار فردي يُنهيه طالب.",`<a class="btn" href="/">${icon("play",16)}<span>افتح صفحة الاختبار</span></a>`);return;}
    const q=RQ.q.toLowerCase();
    const rows=results.filter(r=>(!RQ.cls||r.class_name===RQ.cls)&&(!q||r.full_name.toLowerCase().includes(q)||r.username.toLowerCase().includes(q)));
    $("list").innerHTML=statsHTML(rows)+(rows.length?`<div class="tbl"><table><thead><tr><th>الطالب</th><th>الصف</th><th>الدرجة</th><th>النسبة</th><th>${esc(SITE.scopeHeader)}</th><th>التاريخ</th><th><span class="sr">إجراءات</span></th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td><a class="link" href="/profile.html?id=${r.user_id}"><bdi>${esc(r.full_name)}</bdi></a> <small class="dim"><bdi dir="ltr">@${esc(r.username)}</bdi></small></td><td>${esc(r.class_name||"—")}</td>
       <td>${r.score} من ${r.total}</td><td class="pct">${r.percent}%</td><td>${esc(SITE.scopeLabel(r))}</td><td>${fmtDate(r.created_at)}</td>
       <td><button class="mini danger" data-delres="${r.id}">حذف</button></td></tr>`).join("")}
      </tbody></table></div>`:emptyHTML(`لا نتائج لـ«${RQ.q||RQ.cls}»`,"جرّب اسماً آخر، أو اختر «كل الصفوف»."));
    $("list").querySelectorAll("[data-delres]").forEach(b=>b.onclick=async()=>{if(!confirm("حذف هذه الدرجة؟ لا يمكن التراجع."))return;
      await pending(b,"",async()=>{try{await api("/api/admin/results/"+b.dataset.delres,{method:"DELETE"});show();}catch(err){toast(`<span class="toast-ic">${icon("alert",20)}</span><div><b>تعذّر الحذف</b><small>${esc(err.message)}</small></div>`);}});});
  };
  if($("q")){$("q").oninput=e=>{RQ.q=e.target.value;draw();};$("cls").onchange=e=>{RQ.cls=e.target.value;draw();};}
  draw();
}

// ---------- users ----------
async function staffUsers(title,sub){
  const {users}=await api("/api/admin/users");
  const admin=ME.role==="admin";
  $("pane").innerHTML=`${head(title,sub)}
  <form class="panel" id="add" novalidate><h3>إضافة مستخدم</h3><div class="grid2">
    <div class="field"><label for="u-name">الاسم الكامل</label><input id="u-name" name="full_name" required maxlength="80"></div>
    <div class="field"><label for="u-user">اسم المستخدم</label><input id="u-user" name="username" required dir="ltr" autocapitalize="none" spellcheck="false"><span class="hint">حروف إنجليزية أو أرقام، من 3 إلى 32</span></div>
    <div class="field"><label for="u-pw">كلمة المرور</label><input id="u-pw" name="password" required dir="ltr" autocomplete="new-password"><span class="hint">6 أحرف على الأقل</span></div>
    <div class="field"><label for="u-cls">الصف أو الشعبة</label><input id="u-cls" name="class_name" maxlength="40"></div>
    <div class="field"><label for="u-stage">المرحلة</label><select id="u-stage" name="stage"><option value="">—</option>${STAGES.map(s=>`<option>${s}</option>`).join("")}</select></div>
    <div class="field"><label for="u-role">الصلاحية</label><select id="u-role" name="role"><option value="student">طالب</option>${admin?'<option value="teacher">معلم</option><option value="admin">مدير النظام</option>':""}</select></div>
  </div><div class="msg" id="addMsg" role="alert"></div><div class="row"><button class="primary" type="submit" id="addBtn">إضافة المستخدم</button></div></form>
  <div class="tbl"><table><thead><tr><th>الاسم</th><th>المستخدم</th><th>المرحلة</th><th>الصف</th><th>الصلاحية</th><th>الاختبارات</th><th>أفضل نسبة</th><th>الإنجازات</th><th><span class="sr">إجراءات</span></th></tr></thead><tbody>
  ${users.map(u=>`<tr><td>${u.role==="student"?`<a class="link" href="/profile.html?id=${u.id}"><bdi>${esc(u.full_name)}</bdi></a>`:`<bdi>${esc(u.full_name)}</bdi>`}</td><td><bdi dir="ltr">${esc(u.username)}</bdi></td>
    <td>${u.role==="student"&&u.id!==ME.id?`<select class="mini" data-stage="${u.id}" aria-label="مرحلة ${esc(u.full_name)}"><option value="">—</option>${STAGES.map(s=>`<option ${s===u.stage?"selected":""}>${s}</option>`).join("")}</select>`:esc(u.stage||"—")}</td><td>${esc(u.class_name||"—")}</td><td>${ROLES[u.role]}</td>
    <td>${u.attempts}</td><td>${u.best==null?"—":u.best+"%"}</td><td>${u.role==="student"?`<span class="status">${icon("trophy",16)}${u.badges}</span>`:"—"}</td>
    <td style="white-space:nowrap">${u.id!==ME.id&&(admin||u.role==="student")?`<button class="mini" data-pw="${u.id}">كلمة المرور</button> <button class="mini danger" data-del="${u.id}">حذف</button>`:""}</td></tr>`).join("")}
  </tbody></table></div>`;
  const f=$("add");
  f.onsubmit=async e=>{e.preventDefault();
    const fd=Object.fromEntries(new FormData(f));
    if(!fd.full_name.trim()||!/^[a-z0-9_.-]{3,32}$/i.test(fd.username.trim())||fd.password.length<6){fail($("addMsg"),"تحقّق من الاسم، واسم المستخدم (3–32 حرفاً إنجليزياً)، وكلمة المرور (6 أحرف على الأقل).");return;}
    await pending($("addBtn"),"جارٍ الإضافة…",async()=>{
      try{await api("/api/admin/users",{method:"POST",body:JSON.stringify(fd)});show();}
      catch(err){fail($("addMsg"),err.message);}
    });};
  const note=(ok,msg)=>toast(`<span class="toast-ic">${icon(ok?"check":"alert",20)}</span><div><b>${esc(msg)}</b></div>`);
  $("pane").querySelectorAll("[data-stage]").forEach(sel=>sel.onchange=async()=>{
    try{await api("/api/admin/users/"+sel.dataset.stage,{method:"PATCH",body:JSON.stringify({stage:sel.value})});note(true,"تم حفظ المرحلة");}catch(err){note(false,err.message);}});
  $("pane").querySelectorAll("[data-pw]").forEach(b=>b.onclick=async()=>{const p=prompt("كلمة المرور الجديدة (6 أحرف على الأقل):");if(!p)return;
    try{await api("/api/admin/users/"+b.dataset.pw,{method:"PATCH",body:JSON.stringify({password:p})});note(true,"تم تغيير كلمة المرور");}catch(err){note(false,err.message);}});
  $("pane").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("حذف المستخدم وكل درجاته؟ لا يمكن التراجع."))return;
    try{await api("/api/admin/users/"+b.dataset.del,{method:"DELETE"});show();}catch(err){note(false,err.message);}});
}

// ---------- attempts saved before accounts existed (physics site only) ----------
async function staffLegacy(title,sub){
  const {attempts}=await api("/api/admin/legacy");
  const pctOfT=t=>t&&t.n?Math.round(t.c/t.n*100)+"%":"—";
  $("pane").innerHTML=`${head(title,`${attempts.length} محاولة حُفظت قبل إضافة حسابات الطلاب. الأسماء كما كتبها الطلاب، وهي غير مرتبطة بالحسابات.`)}
  ${attempts.length?`<div class="tbl"><table><thead><tr><th>الاسم</th><th>التاريخ</th><th>الوحدات</th><th>الدرجة</th><th>النسبة</th>${UNIT_KEYS.map(k=>`<th>${esc(TOPICS[k])}</th>`).join("")}</tr></thead><tbody>
  ${attempts.map(a=>`<tr><td><bdi>${esc(a.name)}</bdi></td><td>${fmtDate(a.created_at)}</td><td>${esc(unitsLabel(a.units))}</td><td>${a.correct} من ${a.total}</td>
    <td class="pct">${a.pct}%</td>${UNIT_KEYS.map(k=>`<td>${pctOfT(a.by_topic&&a.by_topic[k])}</td>`).join("")}</tr>`).join("")}
  </tbody></table></div>`:emptyHTML("لا توجد نتائج قديمة","لم يُحفظ أي اختبار قبل إضافة الحسابات.")}`;
}

boot("dashboard",{staffOnly:true}).then(show).catch(bootError);
</script>
</body>
</html>
